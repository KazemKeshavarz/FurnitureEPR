name: Backend CI

on:
  push:
    branches: [ main, feature/project-initialization ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      # فایل Solution شامل پروژه Website قدیمی برای Angular است؛
      # بنابراین Restore پروژه‌های واقعی بک‌اند به‌صورت مستقل انجام می‌شود.
      - name: Restore backend
        run: dotnet restore src/FurnitureEPR.Presentation/FurnitureEPR.Presentation.csproj

      - name: Restore tests
        run: dotnet restore tests/FurnitureEPR.Model.Tests/FurnitureEPR.Model.Tests.csproj

      - name: Build backend
        run: dotnet build src/FurnitureEPR.Presentation/FurnitureEPR.Presentation.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/FurnitureEPR.Model.Tests/FurnitureEPR.Model.Tests.csproj --configuration Release --no-restore --verbosity normal
