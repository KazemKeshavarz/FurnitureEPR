name: Frontend CI

on:
  push:
    branches: [main, feature/project-initialization]
    paths:
      - 'frontend/FurnitureEPR.Angular/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/FurnitureEPR.Angular/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    name: Build Angular frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/FurnitureEPR.Angular
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/FurnitureEPR.Angular/package.json
      - name: نصب وابستگی‌ها
        run: npm install
      - name: ساخت فرانت‌اند
        run: npm run build
